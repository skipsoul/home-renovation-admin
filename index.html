<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>栖居管理后台</title>
  <link rel="stylesheet" href="https://unpkg.com/antd@5/dist/reset.css" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/antd@5/dist/antd.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root{--ink:#1b2625;--gold:#c39247;--cream:#f7f6f2;--muted:#7c8584}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.app{min-height:100vh;background:linear-gradient(135deg,#f9f8f5 0%,#f4f3ef 100%)}.sider{background:#172221!important;position:fixed!important;left:0;top:0;bottom:0;z-index:5}.logo{height:80px;display:flex;align-items:center;gap:11px;padding:0 25px;color:#fff;font-size:19px;font-weight:700;letter-spacing:.8px}.mark{height:33px;width:33px;border-radius:9px;background:var(--gold);display:grid;place-items:center;font-size:18px}.studio{margin:4px 14px 20px;padding:13px 12px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.055);border-radius:12px;display:flex;gap:10px;align-items:center}.studio-name{display:block;color:#f4f5f2;font-size:12px}.studio-sub{display:block;color:#8f9b99;font-size:11px;margin-top:3px}.ant-menu-dark,.ant-menu-dark .ant-menu-sub{background:transparent!important}.ant-menu-dark .ant-menu-item{height:46px;line-height:46px;margin:4px 12px;width:calc(100% - 24px);color:#a9b5b2;border-radius:8px}.ant-menu-dark .ant-menu-item-selected{background:rgba(195,146,71,.18)!important;color:#fff}.ant-menu-dark .ant-menu-item-selected:after{display:none}.sider-help{position:absolute;bottom:25px;left:25px;right:25px;border-top:1px solid rgba(255,255,255,.1);padding-top:16px;color:#84918e;font-size:11px;line-height:1.7}.main{margin-left:250px;padding:0 42px 42px}.top{height:76px;border-bottom:1px solid #e9e7e1;display:flex;align-items:center;justify-content:space-between}.crumb{color:#7d8582;font-size:13px}.crumb b{color:#242e2c}.search{width:280px;background:#efefeb;border:0;border-radius:9px}.search input{background:transparent}.hero{padding:36px 0 29px;display:flex;align-items:flex-end;justify-content:space-between}.eyebrow{color:#b47d2e;font-size:10px;font-weight:700;letter-spacing:1.5px}.hero h1{font-size:30px;margin:7px 0 7px;letter-spacing:-.7px}.hero p{margin:0;color:var(--muted);font-size:14px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.metric{border:0;box-shadow:0 8px 24px rgba(38,46,42,.035);position:relative;min-height:148px}.metric-icon{position:absolute;right:20px;top:20px;width:37px;height:37px;border-radius:10px;background:#f8f0e2;color:#b98235;display:grid;place-items:center;font-size:18px}.metric-label{color:#7d8583;font-size:13px}.metric-value{font-size:25px;font-weight:700;line-height:1.25;margin:9px 0 7px;letter-spacing:-.5px}.metric-trend{color:#3b8b6c;font-size:12px}.content-grid{display:grid;grid-template-columns:minmax(590px,1.72fr) minmax(305px,.78fr);gap:18px;margin-top:22px}.panel{border:0;box-shadow:0 8px 24px rgba(38,46,42,.035)}.panel-title{margin:0;font-size:17px}.subhead{font-size:10px;color:#bd8738;font-weight:700;letter-spacing:1.4px;display:block;margin-bottom:3px}.project-name{font-weight:600;color:#24302e}.project-meta{font-size:12px;color:#8a918f;margin-top:4px}.progress-cell{min-width:110px}.ant-table-wrapper .ant-table-thead>tr>th{background:#faf9f6!important;color:#7d8584!important;font-size:12px}.ant-table-wrapper .ant-table-tbody>tr>td{padding-top:16px!important;padding-bottom:16px!important}.right-col{display:grid;gap:18px}.todo{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #f0efeb}.todo:last-child{border:0}.dot{width:8px;height:8px;border-radius:99px;margin-top:5px;flex:none}.todo-title{display:block;font-size:13px;font-weight:600}.todo-meta{display:block;font-size:11px;color:#8b9290;margin-top:4px}.target{text-align:center}.target h3{margin:3px 0 15px}.target-note{max-width:245px;margin:14px auto 0;padding:7px;border-radius:7px;background:#f8f0e4;color:#a8732d;font-size:11px}@media(max-width:1180px){.metrics{grid-template-columns:repeat(2,1fr)}.content-grid{grid-template-columns:1fr}.right-col{grid-template-columns:1fr 1fr}}@media(max-width:850px){.sider{width:76px!important}.logo{padding:0;justify-content:center;font-size:0}.studio,.sider-help{display:none}.ant-menu-title-content{display:none}.ant-menu-dark .ant-menu-item{padding-left:27px!important}.main{margin-left:76px;padding:0 20px 30px}.hero{align-items:flex-start;gap:15px;flex-direction:column}.metrics{grid-template-columns:1fr}.top .search{display:none}}
  </style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {Layout,Menu,Card,Button,Input,Avatar,Badge,Space,Table,Tag,Progress,ConfigProvider}=antd;
const {Sider,Content}=Layout;
const items=[{key:'1',label:'工作台',icon:'⌂'},{key:'2',label:'客户管理',icon:'♙'},{key:'3',label:'项目管理',icon:'▣'},{key:'4',label:'设计与报价',icon:'◈'},{key:'5',label:'财务中心',icon:'¥'},{key:'6',label:'经营报表',icon:'⌁'}];
const records=[
 {key:'1',name:'云栖公馆 · 全案精装',client:'陈女士 · 项目经理 林知夏',stage:'水电施工',percent:64,due:'10 月 18 日'},
 {key:'2',name:'西溪悦榕 · 平层改造',client:'王先生 · 项目经理 顾言',stage:'方案确认',percent:36,due:'10 月 26 日'},
 {key:'3',name:'澜庭别墅 · 软硬装一体',client:'陆先生 · 项目经理 苏曼',stage:'主材采购',percent:78,due:'11 月 02 日'}];
const columns=[
 {title:'项目',dataIndex:'name',render:(v,r)=><div><span className="project-name">{v}</span><span className="project-meta">{r.client}</span></div>},
 {title:'当前阶段',dataIndex:'stage',render:v=><Tag color="gold">{v}</Tag>},
 {title:'进度',dataIndex:'percent',render:v=><div className="progress-cell"><Progress percent={v} showInfo={false} strokeColor="#c39247" trailColor="#f1eee8"/></div>},
 {title:'计划交付',dataIndex:'due'}];
function Metric({label,value,trend,icon}){return <Card className="metric"><div className="metric-icon">{icon}</div><span className="metric-label">{label}</span><div className="metric-value">{value}</div><span className="metric-trend">{trend}</span></Card>}
function App(){return <ConfigProvider theme={{token:{colorPrimary:'#bd8738',borderRadius:12,fontFamily:'Inter, PingFang SC, Microsoft YaHei, sans-serif'}}}><Layout className="app"><Sider width={250} className="sider"><div className="logo"><span className="mark">栖</span><span>栖居管理</span></div><div className="studio"><Avatar style={{background:'#c39247'}}>栖</Avatar><div><span className="studio-name">栖居空间设计</span><span className="studio-sub">杭州 · 主工作区</span></div></div><Menu theme="dark" mode="inline" defaultSelectedKeys={['1']} items={items}/><div className="sider-help">需要帮助？<br/>联系专属顾问</div></Sider><Layout><Content className="main"><header className="top"><div className="crumb"><b>概览</b>　/　工作台</div><Space size={16}><Input className="search" prefix="⌕" placeholder="搜索项目、客户或单据"/><Badge dot><Button shape="circle" type="text">♧</Button></Badge><Avatar style={{background:'#28423f'}}>朱</Avatar></Space></header><main><section className="hero"><div><span className="eyebrow">SATURDAY, 03 OCTOBER</span><h1>下午好，朱先生</h1><p>今日有 3 项重要待办，2 个项目进入关键施工节点。</p></div><Space><Button>▣　日程安排</Button><Button type="primary">＋　新建项目</Button></Space></section><section className="metrics"><Metric label="本月签约额" value="¥ 286.4 万" trend="↑ 18.6% 较上月" icon="▤"/><Metric label="在建项目" value="24" trend="3 项本周计划交付" icon="◫"/><Metric label="待收款金额" value="¥ 89.6 万" trend="8 笔款项待跟进" icon="¥"/><Metric label="客户满意度" value="98.2%" trend="↑ 1.4% 本季度" icon="✓"/></section><section className="content-grid"><Card className="panel" title={<div><span className="subhead">PROJECT PULSE</span><h3 className="panel-title">重点项目进度</h3></div>} extra={<Button type="link">查看全部</Button>}><Table columns={columns} dataSource={records} pagination={false}/></Card><div className="right-col"><Card className="panel" title={<div><span className="subhead">TODAY</span><h3 className="panel-title">今日待办</h3></div>} extra={<Badge count={3} color="#c39247"/>}><div className="todo"><span className="dot" style={{background:'#cf9c50'}}></span><div><span className="todo-title">确认云栖公馆瓷砖样品</span><span className="todo-meta">采购部 · 14:00</span></div></div><div className="todo"><span className="dot" style={{background:'#5b83b4'}}></span><div><span className="todo-title">西溪悦榕方案提案会</span><span className="todo-meta">设计部 · 16:30</span></div></div><div className="todo"><span className="dot" style={{background:'#5c9b77'}}></span><div><span className="todo-title">回访 3 位竣工客户</span><span className="todo-meta">客户关系部 · 今日</span></div></div></Card><Card className="panel target"><span className="subhead">REVENUE TARGET</span><h3>十月业绩目标</h3><Progress type="circle" percent={72} size={104} strokeColor="#c39247" format={()=> <b>72%</b>}/><div style={{color:'#7e8583',fontSize:12,marginTop:10}}>已完成 ¥286.4 万 / ¥400 万</div><div className="target-note">距离目标还差 ¥113.6 万</div></Card></div></section></main></Content></Layout></Layout></ConfigProvider>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
